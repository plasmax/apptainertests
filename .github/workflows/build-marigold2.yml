name: Marigold V2 (GPU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Disk usage (before)
        run: df -h

      # Biggest win: remove preinstalled toolchains you almost certainly don't need.
      # This frees space on the same filesystem as /home/runner/work (where your .sif is written).
      - name: Free disk space (aggressive)
        run: |
          set -euxo pipefail

          # Big preinstalled stacks (commonly safe to remove for container builds)
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true

          # The CUDA 12.8 torch wheels plus their nvidia-* deps are several GB,
          # so also drop the JVM, which this build does not use.
          sudo rm -rf /usr/lib/jvm || true

          # Clean apt + tmp
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*

          # If docker exists, nuke layers/caches (often several GB)
          docker system prune -af || true

      - name: Disk usage (after)
        run: df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Build Apptainer image
        env:
          # Keep Apptainer caches + staging out of your repo workspace
          APPTAINER_TMPDIR: /tmp
          APPTAINER_CACHEDIR: /tmp/apptainer-cache
        run: |
          set -euxo pipefail
          mkdir -p /tmp/apptainer-cache
          sudo -E apptainer build marigold2.sif definitions/marigold2.def

      - name: Smoke test
        run: |
          set -euxo pipefail
          # The runner has no GPU, so this checks imports and wiring only.
          apptainer exec marigold2.sif python3.10 -c "import torch; print('torch', torch.__version__, 'cuda build', torch.version.cuda)"
          apptainer exec marigold2.sif python3.10 -c "import diffusers, transformers, peft, accelerate, cv2, omegaconf; print('diffusers', diffusers.__version__, 'transformers', transformers.__version__)"
          apptainer exec marigold2.sif python3.10 -c "from diffusers import AutoencoderKLQwenImage, QwenImageTransformer2DModel; print('qwen image classes ok')"
          ls -lh marigold2.sif

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: marigold2-sif
          path: marigold2.sif
